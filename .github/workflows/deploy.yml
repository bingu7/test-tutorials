name: Build & Deploy MkDocs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache social card assets
        uses: actions/cache@v5
        with:
          path: .cache
          key: social-cards-${{ runner.os }}-${{ hashFiles('requirements.txt', 'mkdocs.yml') }}
          restore-keys: |
            social-cards-${{ runner.os }}-

      - name: Install system dependencies for social cards
        run: sudo apt-get update && sudo apt-get install -y libcairo2

      - name: Check JavaScript syntax
        run: |
          for file in docs/javascripts/*.js; do
            node --check "$file"
          done

      - name: Check content consistency
        # 教程数口径：逐分区比对首页/README 标注与 docs/ 下真实文件数
        # 历史问题：首页标题曾写 90+ 而明细表实为 117；README 多个分区停留在补测验之前
        run: python _check_counts.py

      - name: Check hands-on task sections
        # 动手任务结构完整性 + Markdown 代码围栏配平
        # 围栏不配平会把后续整段内容吞进代码块（渲染事故）
        run: python _check_tasks.py

      - name: Check online lab specs
        # 在线练习的题面 JSON 合法性、字段完整性、容器与题面数量匹配
        run: python _check_labs.py

      - name: Check table structure
        # 表格里的裸 HTML 标签（如未转义的 <script>）会让浏览器把后续整段内容
        # 吞进 <table>，表现为页脚浮在表格上；空首列会让内容整体右移一列
        run: python _check_table_html.py

      - name: Build MkDocs site
        run: mkdocs build --strict
        env:
          # 显式开启社交分享卡片生成（social 插件 enabled: !ENV [CI, false]）
          CI: 'true'

      - name: Check built site for broken internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments --exclude-path '^site/404\.html$' 'site/**/*.html'
          fail: true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Upload site artifact for server deployment
        uses: actions/upload-artifact@v6
        with:
          name: site
          path: site/
          retention-days: 1

  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-server:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check server deploy config
        id: server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SERVER_HOST / SERVER_SSH_KEY 未配置，跳过宝塔部署"
          fi

      - name: Download site artifact
        if: steps.server.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: site
          path: site/

      - name: Configure SSH
        if: steps.server.outputs.enabled == 'true'
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          mkdir -p ~/.ssh
          # 写入私钥；若 secret 末尾无换行则补一个（OpenSSH 需要）
          printf '%s' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          if [ -n "$(tail -c1 ~/.ssh/id_ed25519)" ]; then echo >> ~/.ssh/id_ed25519; fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${SERVER_PORT:-22}" "$SERVER_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to server
        if: steps.server.outputs.enabled == 'true'
        env:
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            --exclude='.user.ini' \
            -e "ssh -p ${SERVER_PORT:-22}" \
            site/ \
            "$SERVER_USER@$SERVER_HOST:$DEPLOY_PATH/"
