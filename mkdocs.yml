# 软件测试知识体系 - MkDocs 配置
site_name: 软件测试知识体系
site_description: 面向软件测试工程师的系统化学习教程
site_author: Test Team
site_url: https://bingu7.github.io/test-tutorials/

# GitHub Pages 仓库信息
repo_name: test-tutorials
repo_url: https://github.com/bingu7/test-tutorials
edit_uri: edit/main/docs/

# 主题配置
theme:
  name: material
  language: zh
  logo: assets/images/bingu-logo.png
  custom_dir: overrides          # 自定义模板（评论系统等）
  # 关闭 Google Fonts 远程加载：改用系统字体栈（见 extra.css），
  # 避免国内访问 fonts.googleapis.com 超时拖慢首屏
  font: false
  palette:
    # 浅色模式
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    # 暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.sections       # 侧边栏分组折叠
    - navigation.expand         # 默认展开侧边栏
    - navigation.top            # 返回顶部按钮
    - navigation.instant        # 即时加载（SPA 体验）
    - navigation.footer         # 上/下篇导航
    - navigation.tabs           # 顶部标签导航（非 sticky；上滑导航由自定义 scroll-tabs 负责）
    - search.suggest            # 搜索建议
    - search.highlight          # 搜索高亮
    - content.code.copy         # 代码块复制按钮
    - content.code.annotate     # 代码注释
    - toc.follow                # 目录跟随滚动

  icon:
    repo: fontawesome/brands/github

# 插件
plugins:
  - search:
      separator: '[\s\-\.]+'   # 中文搜索分词
      lang: zh
  - meta:                        # 支持 .meta.yml 批量设置页面元数据（评论开关等）
      meta_file: .meta.yml
  - git-revision-date-localized:   # 页面底部显示“最后更新”时间
      enable_creation_date: false
      type: date
      locale: zh
  # 社交分享卡片（og:image）：仅在 CI 生成，本地构建跳过（省去下载中文字体）
  # 背景色不显式指定：默认跟随站点 palette 的 primary 色（indigo #4051b5）
  - social:
      enabled: !ENV [CI, false]
      cards_layout_options:
        font_family: Noto Sans SC   # 中文字形；默认 Roboto 不含中文

# Markdown 扩展
markdown_extensions:
  - abbr                       # 缩写
  - admonition                 # 提示框
  - attr_list                  # 属性列表
  - def_list                   # 定义列表
  - footnotes                  # 脚注
  - md_in_html                 # 允许 HTML 块内解析 Markdown（需在容器上加 markdown="1"）
  - tables                     # 表格
  - toc:
      permalink: true          # 标题永久链接
  - pymdownx.arithmatex        # 数学公式
  - pymdownx.betterem          # 更好的强调
  - pymdownx.caret             # 上标
  - pymdownx.details           # 折叠块
  - pymdownx.emoji             # 表情
  - pymdownx.highlight:        # 代码高亮
      anchor_linenums: true
  - pymdownx.inlinehilite      # 行内代码高亮
  - pymdownx.keys              # 键盘按键
  - pymdownx.mark              # 高亮文本
  - pymdownx.smartsymbols      # 智能符号
  - pymdownx.superfences:      # 超级围栏（支持嵌套）
      custom_fences:           # ```mermaid 围栏交给 mermaid.js 渲染（见 extra_javascript）
        # 类名用 mermaid-src 而非 mermaid：避免 mermaid 11 在 window load 时的
        # 内置自动扫描（querySelector: ".mermaid"）抢先处理并清空节点、丢失源码
        - name: mermaid
          class: mermaid-src
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:           # 标签页
      alternate_style: true
  - pymdownx.tasklist          # 任务列表
  - pymdownx.tilde             # 删除线

